<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Polymarket Parser Architecture</title>
<style>
  body { margin: 0; background: #0b0f14; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: "JetBrains Mono", Menlo, monospace; }
</style></head><body>
<svg width="860" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="720" fill="#0b0f14"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect x="290" y="24" width="280" height="54" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="47" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">Polymarket Gamma API</text>
  <text x="430" y="65" fill="#8b949e" font-size="10" text-anchor="middle">gamma-api.polymarket.com · REST, без ключа</text>

  <line x1="430" y1="78" x2="430" y2="110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="438" y="98" fill="#58a6ff" font-size="9">GET /series (пагинация 50)</text>
  <rect x="250" y="112" width="360" height="60" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="137" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">Discovery серий</text>
  <text x="430" y="156" fill="#86efac" font-size="10" text-anchor="middle">2443 серии → фильтр slug (актив + тип) → 83 крипто-серии</text>

  <line x1="430" y1="172" x2="430" y2="204" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="438" y="192" fill="#58a6ff" font-size="9">GET /events?series_id (пагинация 100)</text>
  <rect x="250" y="206" width="360" height="60" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="231" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">События серии</text>
  <text x="430" y="250" fill="#86efac" font-size="10" text-anchor="middle">order=endDate desc · фильтр endDate ≥ now (только будущие)</text>

  <line x1="430" y1="266" x2="430" y2="298" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="438" y="286" fill="#58a6ff" font-size="9">markets[] → json.loads(outcomes, clobTokenIds)</text>
  <rect x="250" y="300" width="360" height="60" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="325" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">Запись рынка</text>
  <text x="430" y="344" fill="#86efac" font-size="10" text-anchor="middle">question · conditionId · token_yes/no · bid/ask/mid · volume</text>

  <line x1="430" y1="360" x2="430" y2="392" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="394" width="360" height="56" rx="8" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="418" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">JSON-снимок</text>
  <text x="430" y="437" fill="#c4b5fd" font-size="10" text-anchor="middle">polymarket_crypto_snapshot.json · ~3800 рынков</text>

  <line x1="430" y1="450" x2="430" y2="482" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="438" y="470" fill="#58a6ff" font-size="9">по клику / по запросу (TTL-кэш 5с)</text>

  <rect x="60" y="484" width="230" height="56" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="507" fill="#e6edf3" font-size="12" text-anchor="middle" font-weight="bold">Стакан</text>
  <text x="175" y="526" fill="#8b949e" font-size="9" text-anchor="middle">CLOB /book?token_id</text>

  <rect x="315" y="484" width="230" height="56" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="507" fill="#e6edf3" font-size="12" text-anchor="middle" font-weight="bold">Сделки</text>
  <text x="430" y="526" fill="#8b949e" font-size="9" text-anchor="middle">Data /trades?market</text>

  <rect x="570" y="484" width="230" height="56" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="685" y="507" fill="#e6edf3" font-size="12" text-anchor="middle" font-weight="bold">Топ кошельков</text>
  <text x="685" y="526" fill="#8b949e" font-size="9" text-anchor="middle">агрегация trades по proxyWallet</text>

  <line x1="300" y1="482" x2="175" y2="484" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="482" x2="430" y2="484" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="482" x2="685" y2="484" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="60" y="590" fill="#8b949e" font-size="11" font-weight="bold">Легенда:</text>
  <rect x="60" y="600" width="14" height="14" rx="3" fill="#1e293b" stroke="#94a3b8"/>
  <text x="82" y="612" fill="#8b949e" font-size="11">внешний API</text>
  <rect x="190" y="600" width="14" height="14" rx="3" fill="#064e3b" stroke="#34d399"/>
  <text x="212" y="612" fill="#8b949e" font-size="11">парсер (обработка)</text>
  <rect x="350" y="600" width="14" height="14" rx="3" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="372" y="612" fill="#8b949e" font-size="11">хранилище (JSON)</text>
  <line x1="500" y1="607" x2="545" y2="607" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="555" y="612" fill="#8b949e" font-size="11">поток данных</text>

  <text x="60" y="660" fill="#58a6ff" font-size="11">Связь уровней: conditionId + token_id — сквозные ключи между всеми 5 уровнями.</text>
</svg>
</body></html>
